version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: nis2-isms-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-nis2_isms}
      - POSTGRES_USER=${POSTGRES_USER:-nis2user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - nis2-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nis2user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nis2-isms-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Application
      - APP_NAME=NIS2 ISMS
      - APP_VERSION=1.0.0
      - DEBUG=False
      - ENVIRONMENT=production

      # Security - MUST BE CHANGED!
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30

      # Database - PostgreSQL
      - DATABASE_URL=postgresql://${POSTGRES_USER:-nis2user}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-nis2_isms}

      # CORS - adjust to your domain
      - CORS_ORIGINS=["https://your-domain.com", "http://localhost"]

      # Microsoft Entra
      - ENTRA_ENABLED=${ENTRA_ENABLED:-False}
      - ENTRA_TENANT_ID=${ENTRA_TENANT_ID:-}
      - ENTRA_CLIENT_ID=${ENTRA_CLIENT_ID:-}
      - ENTRA_CLIENT_SECRET=${ENTRA_CLIENT_SECRET:-}
      - ENTRA_REDIRECT_URI=${ENTRA_REDIRECT_URI:-https://your-domain.com/api/auth/entra/callback}
      - ENTRA_AUTHORITY=https://login.microsoftonline.com/

      # Admin User
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@example.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
    networks:
      - nis2-network
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nis2-isms-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    networks:
      - nis2-network
    # For SSL certificates, mount them here:
    # volumes:
    #   - ./certs:/etc/nginx/certs:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  nis2-network:
    driver: bridge

volumes:
  postgres-data:
    driver: local
