version: '3.8'

# ==========================================
# NIS2 ISMS - Portainer Stack
# ==========================================
# This stack includes PostgreSQL for production use
#
# BEFORE DEPLOYING:
# 1. Set environment variables in Portainer UI under "Environment variables"
# 2. Change all passwords and secrets!
# 3. Adjust CORS_ORIGINS to your domain
#
# Required Environment Variables (set in Portainer):
# - SECRET_KEY (generate with: python -c "import secrets; print(secrets.token_urlsafe(32))")
# - ADMIN_PASSWORD
# - POSTGRES_PASSWORD
# ==========================================

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nis2_isms
      POSTGRES_USER: nis2user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - nis2-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nis2user"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    image: ghcr.io/your-repo/nis2-isms-backend:latest
    # Or build from Git repo:
    # build:
    #   context: https://github.com/your-repo/ISMS.git#main:backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_NAME: NIS2 ISMS
      APP_VERSION: 1.0.0
      DEBUG: "False"
      ENVIRONMENT: production

      # Security
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"

      # Database
      DATABASE_URL: postgresql://nis2user:${POSTGRES_PASSWORD}@postgres:5432/nis2_isms

      # CORS - CHANGE THIS!
      CORS_ORIGINS: '["https://your-domain.com"]'

      # Microsoft Entra (optional)
      ENTRA_ENABLED: "False"
      ENTRA_TENANT_ID: ${ENTRA_TENANT_ID:-}
      ENTRA_CLIENT_ID: ${ENTRA_CLIENT_ID:-}
      ENTRA_CLIENT_SECRET: ${ENTRA_CLIENT_SECRET:-}
      ENTRA_REDIRECT_URI: https://your-domain.com/api/auth/entra/callback
      ENTRA_AUTHORITY: https://login.microsoftonline.com/

      # Admin User
      ADMIN_USERNAME: admin
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    networks:
      - nis2-network
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend
  frontend:
    image: ghcr.io/your-repo/nis2-isms-frontend:latest
    # Or build from Git repo:
    # build:
    #   context: https://github.com/your-repo/ISMS.git#main:frontend
    restart: unless-stopped
    ports:
      - "80:80"
      # Uncomment for HTTPS:
      # - "443:443"
    depends_on:
      - backend
    networks:
      - nis2-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  nis2-network:
    driver: bridge

volumes:
  postgres-data:
    driver: local
