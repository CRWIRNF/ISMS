version: '3.8'

# ==========================================
# NIS2 ISMS - Portainer Stack (Pre-built Images)
# ==========================================
# PREREQUISITE: Build images locally first with:
#   docker-compose build --no-cache
#
# This stack uses pre-built local images
# No Git access required!
# ==========================================

services:
  # ============================================
  # Backend API (FastAPI + SQLite)
  # ============================================
  backend:
    image: nis2-isms-backend:latest
    container_name: nis2-isms-backend
    restart: unless-stopped

    ports:
      - "${BACKEND_PORT:-8000}:8000"

    environment:
      # Application Settings
      - APP_NAME=NIS2 ISMS
      - APP_VERSION=1.0.0
      - DEBUG=False
      - ENVIRONMENT=production

      # Security - IMPORTANT: Set via Portainer Environment Variables!
      - SECRET_KEY=${SECRET_KEY:-change-this-secret-key-in-production-min-32-chars}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30

      # Database - SQLite (persistent via volume)
      - DATABASE_URL=sqlite:////app/data/nis2_isms.db

      # CORS - Add your domain(s) here
      - CORS_ORIGINS=${CORS_ORIGINS:-["http://localhost:3000","http://localhost:80","http://localhost"]}

      # Microsoft Entra ID / Azure AD (Optional)
      - ENTRA_ENABLED=${ENTRA_ENABLED:-False}
      - ENTRA_TENANT_ID=${ENTRA_TENANT_ID:-}
      - ENTRA_CLIENT_ID=${ENTRA_CLIENT_ID:-}
      - ENTRA_CLIENT_SECRET=${ENTRA_CLIENT_SECRET:-}
      - ENTRA_REDIRECT_URI=${ENTRA_REDIRECT_URI:-http://localhost:8000/api/auth/entra/callback}
      - ENTRA_AUTHORITY=https://login.microsoftonline.com/

      # Default Admin User (created automatically on first startup)
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@example.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin}

    volumes:
      - backend-data:/app/data

    networks:
      - nis2-network

    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    labels:
      com.portainer.stack: "nis2-isms"
      com.portainer.service: "backend"
      description: "NIS2 ISMS Backend API - FastAPI"

  # ============================================
  # Frontend (React + Nginx)
  # ============================================
  frontend:
    image: nis2-isms-frontend:latest
    container_name: nis2-isms-frontend
    restart: unless-stopped

    ports:
      - "${FRONTEND_PORT:-80}:80"

    depends_on:
      - backend

    networks:
      - nis2-network

    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

    labels:
      com.portainer.stack: "nis2-isms"
      com.portainer.service: "frontend"
      description: "NIS2 ISMS Frontend - React + Nginx"

# ============================================
# Networks
# ============================================
networks:
  nis2-network:
    driver: bridge
    labels:
      com.portainer.stack: "nis2-isms"
      description: "NIS2 ISMS Internal Network"

# ============================================
# Volumes (Persistent Data)
# ============================================
volumes:
  backend-data:
    driver: local
    labels:
      com.portainer.stack: "nis2-isms"
      description: "NIS2 ISMS SQLite Database and Application Data"

# ==========================================
# PORTAINER DEPLOYMENT INSTRUCTIONS
# ==========================================
# 1. Build images locally first:
#    cd /home/user/ISMS
#    docker-compose build --no-cache
#
# 2. In Portainer Web UI:
#    - Go to: Stacks > + Add stack
#    - Name: nis2-isms
#    - Build method: Web editor
#    - Copy this entire file into the editor
#
# 3. Add Environment Variables:
#    SECRET_KEY=your-secure-secret-key-min-32-chars
#    ADMIN_PASSWORD=YourSecurePassword123!
#    FRONTEND_PORT=777
#    BACKEND_PORT=8000
#
# 4. Deploy the stack
# ==========================================
