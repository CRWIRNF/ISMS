version: '3.8'

# ==========================================
# NIS2 ISMS - Portainer Stack (Simplified)
# ==========================================
# Dieser Stack baut die Images direkt beim Deployment
#
# WICHTIG vor dem Deployment:
# 1. Setzen Sie die Environment Variables unten
# 2. Ändern Sie alle Passwörter!
# ==========================================

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nis2_isms
      POSTGRES_USER: nis2user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - nis2-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nis2user"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    # Image wird lokal gebaut - Repository-Pfad anpassen!
    build:
      context: https://github.com/IHRE-ORGANISATION/ISMS.git#claude/nis2-compliance-requirements-011CUoKupKkui9x28zeqpAS2:backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_NAME: NIS2 ISMS
      APP_VERSION: 1.0.0
      DEBUG: "False"
      ENVIRONMENT: production
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      DATABASE_URL: postgresql://nis2user:${POSTGRES_PASSWORD}@postgres:5432/nis2_isms
      CORS_ORIGINS: '["http://localhost", "http://localhost:80"]'
      ENTRA_ENABLED: "False"
      ENTRA_TENANT_ID: ""
      ENTRA_CLIENT_ID: ""
      ENTRA_CLIENT_SECRET: ""
      ENTRA_REDIRECT_URI: http://localhost:8000/api/auth/entra/callback
      ENTRA_AUTHORITY: https://login.microsoftonline.com/
      ADMIN_USERNAME: admin
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    networks:
      - nis2-network
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend
  frontend:
    build:
      context: https://github.com/IHRE-ORGANISATION/ISMS.git#claude/nis2-compliance-requirements-011CUoKupKkui9x28zeqpAS2:frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - nis2-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  nis2-network:
    driver: bridge

volumes:
  postgres-data:
    driver: local
