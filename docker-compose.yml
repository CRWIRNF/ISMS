version: '3.8'

services:
  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nis2-isms-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Application
      - APP_NAME=NIS2 ISMS
      - APP_VERSION=1.0.0
      - DEBUG=False
      - ENVIRONMENT=production

      # Security - CHANGE THESE!
      - SECRET_KEY=${SECRET_KEY:-change-this-secret-key-in-production-min-32-chars}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30

      # Database - SQLite (persistent via volume)
      - DATABASE_URL=sqlite:////app/data/nis2_isms.db

      # CORS
      - CORS_ORIGINS=["http://localhost:3000", "http://localhost:80"]

      # Microsoft Entra
      - ENTRA_ENABLED=${ENTRA_ENABLED:-False}
      - ENTRA_TENANT_ID=${ENTRA_TENANT_ID:-}
      - ENTRA_CLIENT_ID=${ENTRA_CLIENT_ID:-}
      - ENTRA_CLIENT_SECRET=${ENTRA_CLIENT_SECRET:-}
      - ENTRA_REDIRECT_URI=${ENTRA_REDIRECT_URI:-http://localhost:8000/api/auth/entra/callback}
      - ENTRA_AUTHORITY=https://login.microsoftonline.com/

      # Admin User
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@example.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin}
    volumes:
      - backend-data:/app/data
    networks:
      - nis2-network
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nis2-isms-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - nis2-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  nis2-network:
    driver: bridge

volumes:
  backend-data:
    driver: local
