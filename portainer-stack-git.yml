version: '3.8'

# ==========================================
# NIS2 ISMS - Portainer Stack (SQLite + Direct Git Clone)
# ==========================================
# This stack clones directly from GitHub repository
# No pre-built images needed!
# No authentication required (public repo)!
#
# Simply copy this into Portainer Web Editor and deploy!
# ==========================================

services:
  # ============================================
  # Backend API (FastAPI + SQLite)
  # ============================================
  backend:
    image: python:3.11-slim
    container_name: nis2-isms-backend
    restart: unless-stopped
    working_dir: /app

    environment:
      # Application Settings
      APP_NAME: NIS2 ISMS
      APP_VERSION: 1.0.0
      DEBUG: "False"
      ENVIRONMENT: production

      # Security - CHANGE THESE!
      SECRET_KEY: ${SECRET_KEY:-change-this-secret-key-in-production-min-32-chars}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"

      # Database - SQLite
      DATABASE_URL: sqlite:////app/data/nis2_isms.db

      # CORS
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost"]}

      # Microsoft Entra (optional)
      ENTRA_ENABLED: ${ENTRA_ENABLED:-False}
      ENTRA_TENANT_ID: ${ENTRA_TENANT_ID:-}
      ENTRA_CLIENT_ID: ${ENTRA_CLIENT_ID:-}
      ENTRA_CLIENT_SECRET: ${ENTRA_CLIENT_SECRET:-}
      ENTRA_REDIRECT_URI: ${ENTRA_REDIRECT_URI:-http://localhost:8000/api/auth/entra/callback}
      ENTRA_AUTHORITY: https://login.microsoftonline.com/

      # Admin User
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}

    command: >
      bash -c "
      echo '=== Starting Backend Deployment ===' &&
      rm -rf /tmp/repo &&
      apt-get update &&
      apt-get install -y git gcc postgresql-client &&
      echo '=== Cloning repository ===' &&
      git clone https://github.com/CRWIRNF/ISMS.git /tmp/repo &&
      cd /tmp/repo &&
      echo '=== Checking out branch ===' &&
      git checkout claude/nis2-compliance-requirements-011CUoKupKkui9x28zeqpAS2 &&
      echo '=== Copying backend files ===' &&
      cp -r /tmp/repo/backend/* /app/ &&
      mkdir -p /app/data &&
      echo '=== Installing Python dependencies ===' &&
      pip install --no-cache-dir -r /app/requirements.txt &&
      echo '=== Starting uvicorn ===' &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000
      "

    volumes:
      - backend-data:/app/data

    networks:
      - nis2-network

    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

    labels:
      com.portainer.stack: "nis2-isms"
      com.portainer.service: "backend"
      description: "NIS2 ISMS Backend API"

  # ============================================
  # Frontend (React + Nginx)
  # ============================================
  frontend:
    image: nginx:alpine
    container_name: nis2-isms-frontend
    restart: unless-stopped

    ports:
      - "${FRONTEND_PORT:-80}:80"

    depends_on:
      - backend

    command: >
      sh -c "
      echo '=== Starting Frontend Deployment ===' &&
      rm -rf /tmp/repo &&
      apk add --no-cache git nodejs npm &&
      echo '=== Cloning repository ===' &&
      git clone https://github.com/CRWIRNF/ISMS.git /tmp/repo &&
      cd /tmp/repo &&
      echo '=== Checking out branch ===' &&
      git checkout claude/nis2-compliance-requirements-011CUoKupKkui9x28zeqpAS2 &&
      cd /tmp/repo/frontend &&
      echo '=== Installing npm dependencies ===' &&
      npm install &&
      echo '=== Building React app ===' &&
      npm run build &&
      echo '=== Copying build files ===' &&
      cp -r dist/* /usr/share/nginx/html/ &&
      cp /tmp/repo/frontend/nginx.conf /etc/nginx/conf.d/default.conf &&
      echo '=== Starting nginx ===' &&
      nginx -g 'daemon off;'
      "

    networks:
      - nis2-network

    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 120s

    labels:
      com.portainer.stack: "nis2-isms"
      com.portainer.service: "frontend"
      description: "NIS2 ISMS Frontend"

# ============================================
# Networks
# ============================================
networks:
  nis2-network:
    driver: bridge
    labels:
      com.portainer.stack: "nis2-isms"

# ============================================
# Volumes
# ============================================
volumes:
  backend-data:
    driver: local
    labels:
      com.portainer.stack: "nis2-isms"
      description: "NIS2 ISMS SQLite Database"

# ==========================================
# PORTAINER DEPLOYMENT - COPY & PASTE
# ==========================================
# 1. Portainer > Stacks > + Add stack
# 2. Name: nis2-isms
# 3. Build method: Web editor
# 4. Copy this entire file
# 5. Add Environment Variables:
#    SECRET_KEY=your-secure-secret-key-min-32-chars
#    ADMIN_PASSWORD=YourSecurePassword123!
#    FRONTEND_PORT=777
# 6. Deploy the stack
#
# First deployment takes 3-5 minutes (downloads & builds)
# ==========================================
