version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: nis2-isms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nis2_isms
      POSTGRES_USER: nis2user
      POSTGRES_PASSWORD: dbpass456
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - nis2-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nis2user"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: python:3.11-slim
    container_name: nis2-isms-backend
    restart: unless-stopped
    working_dir: /app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_NAME: NIS2 ISMS
      APP_VERSION: 1.0.0
      DEBUG: "False"
      ENVIRONMENT: production
      SECRET_KEY: nis2-sehr-sicherer-schluessel-mindestens-32-zeichen-lang
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      DATABASE_URL: postgresql://nis2user:dbpass456@postgres:5432/nis2_isms
      CORS_ORIGINS: '["http://localhost:777", "http://localhost"]'
      ENTRA_ENABLED: "False"
      ADMIN_USERNAME: admin
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: admin123
    volumes:
      - ./backend:/app
    command: >
      bash -c "
      apt-get update &&
      apt-get install -y gcc postgresql-client &&
      pip install --no-cache-dir -r /app/requirements.txt &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000
      "
    networks:
      - nis2-network
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  frontend:
    image: nginx:alpine
    container_name: nis2-isms-frontend
    restart: unless-stopped
    ports:
      - "777:80"
    depends_on:
      - backend
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - frontend-build:/usr/share/nginx/html:ro
    networks:
      - nis2-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  frontend-builder:
    image: node:18-alpine
    container_name: nis2-isms-frontend-builder
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend-build:/app/dist
    command: sh -c "npm install && npm run build && tail -f /dev/null"

networks:
  nis2-network:
    driver: bridge

volumes:
  postgres-data:
  frontend-build:
